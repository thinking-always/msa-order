name: ci
on:
  push:
    branches: [main]

env:
  IMAGE: ghcr.io/thinking-always/order

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}

      - name: Update manifest repo
        run: |
          git clone https://x-access-token:${{ secrets.MANIFEST_PAT }}@github.com/thinking-always/msa-manifest.git
          cd msa-manifest/overlays/dev
          kustomize edit set image order=${{ env.IMAGE }}:${{ github.sha }}
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git commit -am "order: ${{ github.sha }}"
          git pull --rebase
          git push